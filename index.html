<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eslam Mohamed | Cybersecurity Specialist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #9ca3af;
            --text-bright: #f3f4f6;
            --accent-color: #10b981; /* لون أخضر سيبراني مميز */
            --border-color: #1f2937;
            --btn-hover: #059669;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية الموقع الرئيسية */
        .portfolio-container {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* الكارت الشخصي العلوى */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #10b981, #3b82f6);
        }

        /* تنسيق الصورة الشخصية الدائرية */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
        }

        .profile-card h1 {
            color: var(--text-bright);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .profile-card .job-title {
            color: var(--accent-color);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* قسم اللغات والمهارات */
        .skills-section {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(31, 41, 55, 0.4);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .skills-title {
            font-size: 13px;
            color: var(--text-bright);
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }

        .skills-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .skill-badge {
            background-color: #1f2937;
            color: #e5e7eb;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #374151;
            direction: ltr;
            display: inline-block;
        }

        /* أزرار التواصل الاجتماعي والروابط */
        .links-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1f2937;
            border: 1px solid var(--border-color);
            color: var(--text-bright);
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .action-btn i {
            font-size: 20px;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .action-btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            color: #fff;
        }

        .action-btn:hover i {
            transform: scale(1.1);
            color: #fff;
        }

        /* الفوتر السفلي */
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            margin-top: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <main class="profile-card">
            <img src="me.jpg" alt="Eslam Mohamed" class="profile-img">
            
            <h1>Eslam Mohamed</h1>
            <div class="job-title">Cybersecurity Specialist</div>

            <div class="skills-section">
                <div class="skills-title"><i class="fa-solid fa-code" style="color: var(--accent-color); margin-left: 5px;"></i> اللغات والتقنيات المختصة</div>
                <div class="skills-badges">
                    <span class="skill-badge">Python</span>
                    <span class="skill-badge">Linux</span>
                    <span class="skill-badge">Bash</span>
                    <span class="skill-badge">Network Security</span>
                    <span class="skill-badge">HTML / CSS</span>
                    <span class="skill-badge">JavaScript</span>
                    <span class="skill-badge">SQL</span>
                </div>
            </div>

            <div class="links-area">
                <a href="https://wa.me/966577560714" target="_blank" class="action-btn">
                    <span>تواصل معي عبر واتساب</span>
                    <i class="fa-brands fa-whatsapp" style="color: #25d366;"></i>
                </a>

                <a href="tel:+966577560714" class="action-btn">
                    <span>اتصال هاتفي: +966 57 756 0714</span>
                    <i class="fa-solid fa-phone"></i>
                </a>
                
                <a href="https://www.facebook.com/search/top/?q=Eslam%20Mohamed" target="_blank" class="action-btn">
                    <span>تابعني على فيسبوك (Eslam Mohamed)</span>
                    <i class="fa-brands fa-facebook" style="color: #1877f2;"></i>
                </a>

                <a href="mailto:eslamelshahat04@gmail.com" class="action-btn">
                    <span>أرسل لي بريداً إلكترونياً</span>
                    <i class="fa-regular fa-envelope" style="color: #f3f4f6;"></i>
                </a>
            </div>
        </main>

        <footer class="footer-text">
            &copy; 2026 Eslam Mohamed. جميع الحقوق محفوظة.
        </footer>
    </div>

</body>
</html>
