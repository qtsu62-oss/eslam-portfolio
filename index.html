<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إسلام محمد | المطور والمبرمج الشخصي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --text-bright: #f0f6fc;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --btn-hover: #1f6feb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية الموقع الرئيسية */
        .portfolio-container {
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* الكارت الشخصي العلوى */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #2188ff, #58a6ff);
        }

        /* تنسيق الصورة الشخصية الدائرية */
        .profile-img {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.25);
        }

        .profile-card h1 {
            color: var(--text-bright);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-card p {
            color: var(--accent-color);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* أزرار التواصل الاجتماعي والروابط */
        .links-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-bright);
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .action-btn i {
            font-size: 18px;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .action-btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .action-btn:hover i {
            transform: scale(1.1);
            color: var(--text-bright);
        }

        /* الفوتر السفلي */
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #8b949e;
            margin-top: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <main class="profile-card">
            <img src="me.jpg" alt="إسلام محمد" class="profile-img">
            
            <h1>إسلام محمد الشحات</h1>
            <p>مبرمج ومطور ويب</p>

            <div class="links-area">
                <a href="https://wa.me/201016843479" target="_blank" class="action-btn">
                    <span>تواصل معي عبر واتساب</span>
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                
                <a href="mailto:eslamelshahat04@gmail.com" class="action-btn">
                    <span>أرسل لي بريداً إلكترونياً</span>
                    <i class="fa-regular fa-envelope"></i>
                </a>
            </div>
        </main>

        <footer class="footer-text">
            &copy; 2026 إسلام محمد. جميع الحقوق محفوظة.
        </footer>
    </div>

</body>
</html>
